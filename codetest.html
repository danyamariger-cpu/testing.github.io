.qt-card {

    flex-direction: column;
}

.qt-card .qt-icon-quote {
    width: 36px;
    height: 36px;
    color: #e5e7eb; /* A light, subtle gray */

}

.qt-card .qt-blockquote {
    flex-grow: 1; /* Allows the quote to take up available space */
    margin: 0;
    font-size: 1.1rem;
    font-style: italic;
    line-height: 1.6;
    color: #4b5563; /* A muted gray */
}

.qt-card .qt-blockquote p {
    margin: 0;
}

.qt-card .qt-figcaption {
    margin-top: 1.5rem;
    padding-top: 1.5rem;
    border-top: 1px solid #f3f4f6; /* A very light divider line */
    display: flex;
    align-items: center;
    gap: 1rem;
}

.qt-card .qt-avatar {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    object-fit: cover;
    flex-shrink: 0; /* Prevents avatar from shrinking */
}

.qt-card .qt-author-details {

}

.qt-card .qt-author-name {

    margin: 0;
}

.qt-card .qt-author-role {
    font-size: 0.9rem;
    color: #5d86c9;
    margin: 0;
}
</style>

body {

.cards-grid-container {

/* === Calendar Date Card Styles === */
.cal-card {
    --cal-card-radius: 12px;
    --cal-card-shadow: 0 4px 10px rgba(0,0,0,0.06);

    background-color: #ffffff;
    border-radius: var(--cal-card-radius);
    box-shadow: var(--cal-card-shadow);
    display: flex;
    align-items: center;
    padding: 1rem;
    gap: 1.25rem;
    transition: box-shadow 0.2s ease, transform 0.2s ease;
}

.cal-card:hover {
    transform: translateY(-5px);
    box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1), 0 4px 6px -4px rgba(0,0,0,0.1);
}

.cal-card-link {
    color: inherit;
    text-decoration: none;
    display: flex;
    align-items: center;
    flex-grow: 1;
    gap: 1.25rem;
}

/* The date block */
.cal-card-date-block {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start; /* Aligns content to the top */
    flex-shrink: 0;
    width: 80px;
    height: 80px;
    border-radius: 10px;
    background-color: #f9fafb;
    border: 1px solid #e5e7eb;
    overflow: hidden; /* Important for containing the month banner */
}

.cal-card-month {
    display: block;
    width: 100%;
    text-align: center;
    background-color: #ef4444; /* Red for emphasis */
    color: #ffffff;
    font-size: 0.8rem;
    font-weight: 600;
    text-transform: uppercase;
    padding: 0.35rem 0;
}

.cal-card-day {
    font-size: 2.25rem;
    font-weight: 700;
    color: #111827;
    line-height: 1.2;
    margin-top: 0.35rem;
}

/* Event info block */
.cal-card-info {
    flex-grow: 1;
}

.cal-card-title {
    font-size: 1.125rem;
    font-weight: 600;
    margin: 0 0 0.35rem;
    line-height: 1.3;
}

.cal-card-details {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    font-size: 0.95rem;
    color: #4b5563;
}

.cal-card-details svg {
    width: 16px;
    height: 16px;
    color: #9ca3af;
    flex-shrink: 0;
}
</style>
